<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개드립 메모장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      width: 360px;
      min-height: 480px;
      padding: 16px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .popup-header h1 {
      font-size: 18px;
      color: #ff5a35;
      flex: 1;
    }

    .memo-count {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }

    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      background: #fff;
    }

    .search-box:focus { border-color: #ff7e5f; }

    .memo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .memo-item {
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .memo-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .memo-nick {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    .memo-srl {
      font-size: 11px;
      color: #aaa;
      font-weight: normal;
      margin-left: 5px;
    }

    .memo-delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
    }

    .memo-delete-btn:hover { color: #d83b3b; }

    .memo-text {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .memo-time {
      font-size: 10px;
      color: #aaa;
      margin-top: 5px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 13px;
      line-height: 2;
    }

    .empty-state .emoji { font-size: 32px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>개드립 메모장</h1>
    <span class="memo-count" id="memo-count"></span>
  </div>

  <input type="text" class="search-box" id="search-input" placeholder="유저명 또는 메모 내용 검색...">

  <ul class="memo-list" id="memo-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
